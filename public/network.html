<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sparge Network</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/site-shell.js" defer></script>
</head>
<body>
  <header class="site-header" data-site-header data-active-nav="network"></header>

  <main class="page-container">
    <section class="network-overview">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Network</p>
          <h1 class="page-title">Network Health</h1>
        </div>
      </div>
      <p class="network-note">Sparge Chain currently uses one official producer. Observer nodes independently sync and validate the chain state.</p>
      <p class="network-note">Only observers that opted into public listing appear here. Private observers are still included in aggregate network statistics.</p>
      <div class="network-grid network-infrastructure-grid" id="networkHealthPanel"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Observer Nodes</h2>
        <form class="observer-filters" id="observerFilters">
          <select id="observerStatusFilter" aria-label="Status filter">
            <option value="">All statuses</option>
            <option value="fully_synced">Fully Synced</option>
            <option value="syncing">Syncing</option>
            <option value="mismatch">Mismatch</option>
            <option value="offline">Offline</option>
          </select>
          <input id="observerCountryFilter" type="text" maxlength="2" placeholder="Country" />
          <input id="observerVersionFilter" type="text" maxlength="32" placeholder="Version" />
          <button class="btn ghost" type="submit">Filter</button>
        </form>
      </div>
      <div class="observer-list" id="observerNodesList"></div>
      <div class="panel-footer" id="observerPager"></div>
    </section>
  </main>

  <script src="/explorer-tx.js"></script>
  <script src="/participant-ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
