<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sparge Explorer</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="hero">
    <a class="brand" href="/">
      <img src="/assets/sparge_logo.png" alt="Sparge logo" class="logo-img" />
      <div class="title">Sparge</div>
    </a>
    <nav class="top-nav">
      <a href="/" class="nav-link active">Explorer</a>
      <a href="/wallet" class="nav-link">Wallet</a>
      <a href="https://spargenetwork.github.io/sparge-docs/" class="nav-link" target="_blank" rel="noreferrer">Docs</a>
    </nav>
    <div class="header-actions">
      <div class="toggle">
        <button id="viewBasic" class="btn chip active">Basic</button>
        <button id="viewAdvanced" class="btn chip">Advanced / Protocol</button>
      </div>
    </div>
  </header>

  <main>
    <section class="info-panels">
      <div class="info-panel">
        <div class="panel-title">Status</div>
        <div class="panel-body" id="statusPanel"></div>
      </div>
      <div class="info-panel">
        <div class="panel-title">Genesis</div>
        <div class="panel-body" id="genesisPanel"></div>
      </div>
    </section>
    <section class="search-panel">
      <form id="searchForm" class="search">
        <input id="searchInput" type="text" placeholder="Search block / tx / address" />
        <button class="btn ghost" type="submit">Search</button>
      </form>
    </section>
    <section class="stats" id="chainStats"></section>

    <section class="panel">
      <div class="panel-header">
        <h2>Blocks</h2>
        <div class="pager" id="pagerTop"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Height</th>
              <th>Txs</th>
              <th>Timestamp</th>
              <th>Hash</th>
              <th>Prev hash</th>
              <th>State root</th>
              <th>Reward</th>
            </tr>
          </thead>
          <tbody id="blocksTable"></tbody>
        </table>
      </div>
      <div class="panel-footer" id="pagerBottom"></div>
    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
