<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sparge Explorer</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/site-shell.js" defer></script>
</head>
<body>
  <header class="site-header" data-site-header data-active-nav="explorer"></header>

  <main class="page-container">
    <section class="explorer-overview">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Live chain activity</p>
          <h1 class="page-title">Sparge Chain Explorer</h1>
        </div>
      </div>
      <div class="homepage-stats" id="homepageStats"></div>
    </section>

    <section class="search-panel">
      <form id="searchForm" class="search">
        <input id="searchInput" type="text" placeholder="Search block height, transaction hash, or address" aria-label="Search block, transaction, or address" />
        <button class="btn ghost" type="submit">Search</button>
      </form>
    </section>

    <section class="explorer-activity-grid">
      <section class="panel activity-panel">
        <div class="panel-header">
          <h2>Latest Transactions</h2>
        </div>
        <div class="latest-transactions" id="latestTransactionsPanel"></div>
      </section>

      <section class="panel activity-panel transaction-chart-panel">
        <div class="panel-header chart-header">
          <div>
            <h2>Transactions</h2>
            <p class="panel-caption">Transactions over time</p>
          </div>
          <div class="chart-range-tabs" id="transactionChartRanges" role="group" aria-label="Transaction chart range">
            <button type="button" data-chart-range="24h" class="active">24 Hours</button>
            <button type="button" data-chart-range="7d">7 Days</button>
            <button type="button" data-chart-range="30d">30 Days</button>
            <button type="button" data-chart-range="all">All Time</button>
          </div>
        </div>
        <div class="transaction-chart" id="transactionChart" aria-live="polite">
          <canvas id="transactionChartCanvas" role="img" aria-label="Transaction count over time"></canvas>
          <div class="chart-tooltip" id="transactionChartTooltip" hidden></div>
          <div class="chart-empty" id="transactionChartEmpty">Loading transaction activity...</div>
        </div>
      </section>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Blocks</h2>
        <div class="pager" id="pagerTop"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Height</th>
              <th>Txs</th>
              <th>Timestamp</th>
              <th>Hash</th>
              <th>Prev hash</th>
              <th>State root</th>
            </tr>
          </thead>
          <tbody id="blocksTable"></tbody>
        </table>
      </div>
      <div class="panel-footer" id="pagerBottom"></div>
    </section>

  </main>

  <script src="/explorer-tx.js"></script>
  <script src="/participant-ui.js"></script>
  <script src="/transaction-chart.js"></script>
  <script src="/app.js"></script>
</body>
</html>
