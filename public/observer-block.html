<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sparge Observer Block</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/site-shell.js" defer></script>
</head>
<body class="observer">
  <header class="site-header" data-site-header data-active-nav="explorer"></header>

  <main class="page-container">
    <section class="panel" id="blockPage">
      <div class="panel-header">
        <div>
          <a class="back-link" href="/">Back to Explorer</a>
          <h1 class="page-title">Block</h1>
        </div>
        <div class="toast" id="copyToast">Copied!</div>
      </div>
      <div class="block-tabs">
        <button class="tab-btn active" data-tab="overview">Overview</button>
        <button class="tab-btn" data-tab="transactions">Transactions</button>
      </div>
      <div class="block-tab-panel active" data-tab-panel="overview">
        <div class="details-grid" id="blockDetailsBody">
          <div class="detail-empty">Loading blockâ€¦</div>
        </div>
      </div>
      <div class="block-tab-panel" data-tab-panel="transactions">
        <div class="tx-list" id="blockTxList">
          <div class="detail-empty">Loading transactionsâ€¦</div>
        </div>
      </div>
    </section>
  </main>

  <script src="/explorer-tx.js"></script>
  <script src="/participant-ui.js"></script>
  <script src="/reward-distribution.js"></script>
  <script src="/app.js"></script>
</body>
</html>
