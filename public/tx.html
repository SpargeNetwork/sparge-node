<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sparge Transaction</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/site-shell.js" defer></script>
</head>
<body>
  <header class="site-header" data-site-header data-active-nav="explorer"></header>

  <main class="page-container">
    <section class="panel" id="txPage">
      <div class="panel-header">
        <div>
          <a class="back-link" id="txBackLink" href="/">Back to Explorer</a>
          <h1 class="page-title">Transaction</h1>
        </div>
      </div>

      <div class="tx-page-grid">
        <div class="wallet-card">
          <div class="card-title">Summary</div>
          <div class="details-grid" id="txSummary"></div>
        </div>
        <div class="wallet-card">
          <div class="card-title">Parties</div>
          <div class="details-grid" id="txParties"></div>
        </div>
        <div class="wallet-card">
          <div class="card-title">Amount & Fees</div>
          <div class="details-grid" id="txAmounts"></div>
        </div>
        <div class="wallet-card" id="txParticipationCard">
          <div class="card-title">Participation Impact</div>
          <div class="details-grid" id="txParticipation"></div>
        </div>
        <details class="wallet-section" id="txTechnical">
          <summary>Technical details</summary>
          <div class="section-body">
            <div class="details-grid" id="txTechnicalBody"></div>
          </div>
        </details>
      </div>
    </section>
  </main>

  <script src="/explorer-tx.js"></script>
  <script src="/participant-ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
