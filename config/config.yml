chain:
  name: Sparge
  symbol: SPRG
  chainId: "sparge-mainnet"
  blockTimeSeconds: 51
  protocolVersion: "1.0.0"
  economicsVersion: "1.0.0"

token:
  decimals: 9
  initialSupplyTokens: "5100000000"

economics:
  participation:
    activeWindowBlocks: 5100
    bondMicro: "50000000"
    maxSponsoredParticipants: 10
  participantRewardRamp:
    enabled: true
    activationHeight: 1000
    stages:
      - blocks: 5100
        multiplier: "0.25"
      - blocks: 10200
        multiplier: "0.60"
      - blocks: null
        multiplier: "1.00"

mining:
  proposerAddress: "spg_3D9sm1pyziUMXCkqYaJML3KJRpPd"
  genesisOperatorAddress: "spg_2jCwDGKiH9CdfhkAZWKv6fSiAacn"
  genesisFreeBlocks: 100

rewards:
  treasuryAddress: "spg_ojsJmWnCUdu8t4VWjU4CmiZkYPn"
  nodePoolAddress: "spg_PHxAiV4Tp2VwPN3QHhGt7R7JXzQ"
  holderPoolAddress: "spg_3iq23T44YH5YKu4kqdrVwb9aaE34"

storage:
  backend: sqlite
  blocksPerFile: 510

gas:
  blockLimit: 510
  targetRatioBps: 8000
  baseFeeInitialMicro: "1000"
  baseFeeChangeDenominator: 8
  minBaseFeeMicro: "0"

mempool:
  sort: fee
  maxTransactions: 10000
  maxBytes: 52428800
  maxTransactionsPerSender: 100
  transactionTtlSeconds: 3600
  maxFutureNonceGap: 100
  minimumFeeMicro: "0"

invariants:
  enabled: true
  fastChecksEveryBlock: true
  fullAuditOnStartup: true
  fullAuditIntervalBlocks: 0
  stopMiningOnFailure: true

logging:
  level: info
  format: pretty
  directory: logs
  fileEnabled: true
  consoleEnabled: true
  maxFileSizeBytes: 10485760
  maxFiles: 10
  redactSensitiveFields: true
  logEmptyBlocks: false

tx:
  minFeeMicro: "1000"

dev:
  enableAdmin: true

operatorDashboard:
  enabled: true
  bindLocalOnly: true

communityIdentity:
  enabled: false
  publicBaseUrl: ""
  discord:
    clientId: ""
    clientSecret: ""
    botToken: ""
    guildId: ""
    oauthRedirectUri: ""
    roles:
      verifiedWallet: "1526598701777424395"
      participant: "1526598779250409594"
      matureParticipant: "1526598835672191116"
      observerOperator: ""
      publicObserver: ""
      builder: ""
      earlyAlpha: ""
  challenge:
    expiresSeconds: 600
  sessions:
    expiresSeconds: 1800
  roleSync:
    enabled: true
    intervalSeconds: 300
    failureGraceSeconds: 1800
  privacy:
    publicProfilesDefault: false
    publicDiscordNameDefault: false
    publicBadgesDefault: false
    publicWalletVerifiedDefault: false
    publicParticipantStatusDefault: false
    publicObserverStatusDefault: false
    publicBalanceDefault: false

http:
  corsAllowedOrigins:
    - "http://localhost:3051"
    - "http://127.0.0.1:3051"
    - "http://localhost:3052"
    - "http://127.0.0.1:3052"
  rateLimit:
    windowMs: 60000
    max: 600
  txRateLimit:
    windowMs: 60000
    max: 60
  blocksSyncRateLimit:
    windowMs: 60000
    max: 120

security:
  trustProxy: false
  maxJsonBodyBytes: 32768
  maxTransactionBodyBytes: 16384
  maxHeartbeatBodyBytes: 4096
  maxObserverSettingsBodyBytes: 4096
  maxCommunityBodyBytes: 8192
  rateLimits:
    enabled: true
    global:
      windowSeconds: 60
      maxRequests: 300
    transaction:
      windowSeconds: 60
      maxRequestsPerIp: 10
      maxConcurrentPerIp: 3
    heartbeat:
      windowSeconds: 60
      maxRequestsPerIp: 10
      maxRequestsPerNodeId: 2
    observerSettings:
      windowSeconds: 60
      maxRequestsPerIp: 10
    addressHistory:
      windowSeconds: 60
      maxRequestsPerIp: 30
    blockAndTxLookup:
      windowSeconds: 60
      maxRequestsPerIp: 60
    publicRead:
      windowSeconds: 60
      maxRequestsPerIp: 120
    operator:
      windowSeconds: 60
      maxRequestsPerIp: 5
    communityOAuth:
      windowSeconds: 600
      maxRequestsPerIp: 10
    communityChallenge:
      windowSeconds: 600
      maxRequestsPerIp: 5
    communityVerify:
      windowSeconds: 600
      maxRequestsPerIp: 10
    communitySync:
      windowSeconds: 3600
      maxRequestsPerIp: 5
    communityUnlink:
      windowSeconds: 3600
      maxRequestsPerIp: 5

node:
  mode: producer
  producerUrl: "http://localhost:3051"
  sync:
    batchSize: 50
    intervalMs: 2000
    timeoutMs: 5000

observer:
  publicListingEnabled: false
  publicAlias: ""
  countryCode: ""

network:
  heartbeatIntervalSeconds: 60
  observerOfflineAfterSeconds: 180
  observerRetentionDays: 180
  publicObserverListEnabled: true
  heartbeatRateLimit:
    windowMs: 60000
    max: 20

