services:
  producer:
    build: .
    image: sparge-node:local
    restart: unless-stopped
    environment:
      NODE_MODE: producer
      PORT: 3051
      DATA_DIR: /app/data
      CONFIG_PATH: /app/config/config.yml
      SECURITY_TRUST_PROXY: "1"
      CORS_ALLOW_ORIGINS: "https://${SPARGE_DOMAIN:?Set SPARGE_DOMAIN in .env or the shell}"
      LOG_FORMAT: json
      LOG_CONSOLE_ENABLED: "true"
      LOG_FILE_ENABLED: "false"
      COMMUNITY_IDENTITY_ENABLED: "${COMMUNITY_IDENTITY_ENABLED:-false}"
      COMMUNITY_PUBLIC_BASE_URL: "${COMMUNITY_PUBLIC_BASE_URL:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:-}"
      DISCORD_OAUTH_REDIRECT_URI: "${DISCORD_OAUTH_REDIRECT_URI:-}"
      COMMUNITY_ROLE_SYNC_ENABLED: "${COMMUNITY_ROLE_SYNC_ENABLED:-true}"
    expose:
      - "3051"
    volumes:
      - sparge-producer-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "scripts/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - sparge-internal

  observer:
    build: .
    image: sparge-node:local
    restart: unless-stopped
    depends_on:
      producer:
        condition: service_healthy
    environment:
      NODE_MODE: observer
      PORT: 3052
      DATA_DIR: /app/data
      PRODUCER_URL: http://producer:3051
      CONFIG_PATH: /app/config/config.yml
      SECURITY_TRUST_PROXY: "1"
      CORS_ALLOW_ORIGINS: "https://${SPARGE_DOMAIN:?Set SPARGE_DOMAIN in .env or the shell}"
      LOG_FORMAT: json
      LOG_CONSOLE_ENABLED: "true"
      LOG_FILE_ENABLED: "false"
    expose:
      - "3052"
    volumes:
      - sparge-observer-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "scripts/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sparge-internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      producer:
        condition: service_healthy
    environment:
      SPARGE_DOMAIN: ${SPARGE_DOMAIN:?Set SPARGE_DOMAIN in .env or the shell}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sparge-internal
      - sparge-public

volumes:
  sparge-producer-data:
  sparge-observer-data:
  caddy-data:
  caddy-config:

networks:
  sparge-internal:
    internal: true
  sparge-public:
